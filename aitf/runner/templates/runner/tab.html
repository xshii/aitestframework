<style>
.port-row{background:#f8f9fa;border:1px solid #e9ecef;border-radius:4px;padding:6px 10px;margin-bottom:4px;}
.port-badge{font-size:.65rem;padding:1px 5px;}
.port-status{font-size:.78rem;}
#envForm ::placeholder{color:#bbb !important;opacity:1;}
</style>

{% from "macros.html" import sync_bar with context %}
{% call() sync_bar() %}
  <button class="btn btn-sm btn-primary" onclick="envSyncFromServer()">从服务器同步</button>
  <span id="envSyncMsg" class="ms-2 small"></span>
{% endcall %}

<div class="d-flex align-items-center mb-2">
  <span class="fw-bold me-2">执行环境</span>
  <span class="badge bg-secondary" id="envCount">0</span>
  <select class="form-select form-select-sm ms-2" id="envPlatFilter" style="width:auto" onchange="envRefresh()">
    <option value="">全部平台</option>
  </select>
  <button class="btn btn-sm btn-outline-primary ms-2 py-0" onclick="envRefresh()">刷新</button>
  <button class="btn btn-sm btn-primary ms-2 py-0" onclick="envShowAdd()">+ 添加</button>
</div>

<table class="table table-sm table-striped table-hover" id="envTable" style="display:none">
  <thead>
    <tr>
      <th>名称</th>
      <th>平台</th>
      <th>资源池</th>
      <th>连接</th>
      <th>状态</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="envBody"></tbody>
</table>
<p id="envEmpty" class="text-muted small">暂无执行环境配置。点击"添加"创建。</p>

{# ===== 添加 / 编辑表单 ===== #}
<div class="card mt-2" id="envForm" style="display:none">
  <div class="card-body">
    <h6 class="card-title" id="envFormTitle">添加执行环境</h6>
    <input type="hidden" id="envEditName">
    <div class="row g-2 mb-2">
      <div class="col-md-3">
        <label class="form-label small">名称 <span class="text-danger">*</span></label>
        <input class="form-control form-control-sm" id="envName" placeholder="fpga-board-1">
      </div>
      <div class="col-md-3">
        <label class="form-label small" title="执行环境的用途分类，如 pc_func(PC功能)、fpga、emu 等">平台 <span class="text-danger">*</span></label>
        <select class="form-select form-select-sm" id="envPlatform"></select>
      </div>
      <div class="col-md-3">
        <label class="form-label small" title="同一池内的环境可被自动分配，提交到池名时系统选最空闲的环境">资源池</label>
        <input class="form-control form-control-sm" id="envPool" list="envPoolList" placeholder="留空表示不参与池化">
        <datalist id="envPoolList"></datalist>
      </div>
    </div>

    {# SSH 连接信息（主连接） #}
    <div class="mb-2">
      <label class="form-label small fw-bold">SSH 连接</label>
      <div class="text-muted small mb-1">本地环境留空即可。远程环境填写 SSH 信息。</div>
      <div class="row g-2">
        <div class="col-md-3">
          <input class="form-control form-control-sm" id="envHost" placeholder="192.168.1.10">
        </div>
        <div class="col-md-2">
          <input class="form-control form-control-sm" id="envPort" type="number" placeholder="22">
        </div>
        <div class="col-md-2">
          <input class="form-control form-control-sm" id="envUser" placeholder="root">
        </div>
        <div class="col-md-3">
          <input class="form-control form-control-sm" id="envPassword" type="password" placeholder="密码 (可选)">
        </div>
      </div>
    </div>

    {# 高级选项（默认折叠） #}
    <div class="mb-2">
      <a class="small text-muted" data-bs-toggle="collapse" href="#envAdvanced" role="button" style="text-decoration:none">
        ▶ 高级选项
      </a>
      <div class="collapse mt-2" id="envAdvanced">
        {# 额外端口 #}
        <div class="mb-2">
          <div class="d-flex align-items-center mb-1">
            <label class="form-label small mb-0">额外端口 (JTAG/串口等)</label>
            <button class="btn btn-sm btn-outline-primary ms-2 py-0" style="font-size:.7rem" onclick="envAddPort()">+ 添加</button>
          </div>
          <div id="envPortList"></div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-primary" id="envSaveBtn" onclick="envSave()">保存</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="envCancelForm()">取消</button>
      <small class="text-danger align-self-center" id="envFormMsg"></small>
    </div>
  </div>
</div>

<script>
(function(){
var _targets=[];
var _platforms=[];

var _platBadge={
  pc_func:'bg-success',pc_perf:'bg-primary',
  fpga:'bg-warning text-dark',emu:'bg-info text-dark',eda:'bg-secondary'
};

function _loadPlatforms(){
  fetch('/api/targets/platforms').then(function(r){return r.json();}).then(function(list){
    _platforms=list;
    var filt=document.getElementById('envPlatFilter');
    var html='<option value="">全部平台</option>';
    list.forEach(function(p){html+='<option value="'+_esc(p.name)+'">'+_esc(p.label||p.name)+'</option>';});
    filt.innerHTML=html;
    var sel=document.getElementById('envPlatform');
    var shtml='';
    list.forEach(function(p){shtml+='<option value="'+_esc(p.name)+'">'+_esc(p.label||p.name)+'</option>';});
    sel.innerHTML=shtml;
  });
}

function _loadPools(){
  fetch('/api/targets/pools').then(function(r){return r.json();}).then(function(pools){
    var dl=document.getElementById('envPoolList');
    var html='';
    (pools||[]).forEach(function(p){
      html+='<option value="'+_esc(p.pool)+'">';
    });
    dl.innerHTML=html;
  });
}

window.envRefresh=function(){
  var platFilter=document.getElementById('envPlatFilter').value;
  fetch('/api/targets').then(function(r){return r.json();}).then(function(data){
    _targets=data;
    var items=platFilter?data.filter(function(t){return t.platform===platFilter;}):data;
    document.getElementById('envCount').textContent=items.length;
    var tb=document.getElementById('envBody');
    var tbl=document.getElementById('envTable');
    var empty=document.getElementById('envEmpty');
    if(!items.length){tbl.style.display='none';empty.classList.remove('d-none');return;}
    tbl.style.display='';empty.classList.add('d-none');

    var html='';
    items.forEach(function(t){
      var pBadge=_platBadge[t.platform]||'bg-secondary';
      var pLabel=t.platform||'—';

      // 连接摘要
      var ports=t.ports||{};
      var portKeys=Object.keys(ports);
      var connSummary='';
      if(!portKeys.length){
        connSummary='<span class="text-muted small">本地</span>';
      }else{
        var host='',user='';
        portKeys.forEach(function(pk){
          var pc=ports[pk];
          if(!host && pc.host){host=pc.host;user=pc.user||'';}
        });
        var info=user?(user+'@'+host):host;
        var extraCount=portKeys.length>1?' <span class="badge bg-light text-dark port-badge">+'+( portKeys.length-1)+'端口</span>':'';
        connSummary='<span class="small">'+_esc(info)+'</span>'+extraCount;
      }

      var poolLabel=t.pool?'<span class="badge" style="font-size:.7rem;border:1px solid #adb5bd;color:#6c757d">'+_esc(t.pool)+'</span>':'<span class="text-muted small">—</span>';
      html+='<tr>'
        +'<td><strong>'+_esc(t.name)+'</strong></td>'
        +'<td><span class="badge '+pBadge+'">'+_esc(pLabel)+'</span></td>'
        +'<td>'+poolLabel+'</td>'
        +'<td>'+connSummary+'</td>'
        +'<td><span class="port-status" id="env-st-'+_esc(t.name)+'">—</span></td>'
        +'<td class="text-end">'
          +'<button class="btn btn-sm btn-outline-success py-0 me-1" onclick="envTest(\''+_esc(t.name)+'\')" title="测试环境各端口是否可达">测试</button>'
          +'<button class="btn btn-sm btn-outline-warning py-0 me-1" onclick="envRestart(\''+_esc(t.name)+'\')" title="执行启动/重启流程（烧录→上传→启动→验证）">重启</button>'
          +'<button class="btn btn-sm btn-outline-secondary py-0 me-1" onclick="envScripts(\''+_esc(t.name)+'\')" title="管理重启脚本和烧录文件">脚本</button>'
          +'<button class="btn btn-sm btn-outline-primary py-0 me-1" onclick="envEdit(\''+_esc(t.name)+'\')">编辑</button>'
          +'<button class="btn btn-sm btn-outline-danger py-0" onclick="envDel(\''+_esc(t.name)+'\')">删除</button>'
        +'</td></tr>';
    });
    tb.innerHTML=html;
  });
};

window.envTest=function(name){
  var el=document.getElementById('env-st-'+name);
  if(el) el.innerHTML='<span class="text-warning">检测中...</span>';
  fetch('/api/targets/'+encodeURIComponent(name)+'/test',{method:'POST'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!el) return;
      var portResults=d.ports||{};
      var portKeys=Object.keys(portResults);
      if(!portKeys.length){
        el.innerHTML=d.ok?'<span class="text-success">'+_esc(d.message)+'</span>'
                         :'<span class="text-danger">'+_esc(d.message)+'</span>';
        return;
      }
      var html='';
      portKeys.forEach(function(pk){
        var pr=portResults[pk];
        var color=pr.ok?'text-success':'text-danger';
        html+='<div class="'+color+'" style="font-size:.75rem">'+_esc(pk)+': '+_esc(pr.message)+'</div>';
      });
      el.innerHTML=html;
    });
};

/* ----- 额外端口管理 (高级选项) ----- */
var _portCounter=0;

function _renderPortRow(pname,pcfg){
  pcfg=pcfg||{};
  var id='port_'+(_portCounter++);
  // 默认用主连接的 IP
  var defaultHost=pcfg.host||document.getElementById('envHost').value||'';
  return '<div class="port-row" id="'+id+'">'
    +'<div class="d-flex align-items-center gap-2 flex-wrap">'
    +'<input class="form-control form-control-sm port-name" value="'+_esc(pname||'')+'" placeholder="jtag" style="width:90px">'
    +'<select class="form-select form-select-sm port-type" style="width:80px">'
      +'<option value="tcp"'+(pcfg.type==='tcp'?' selected':'')+'>TCP</option>'
      +'<option value="ssh"'+(pcfg.type==='ssh'?' selected':'')+'>SSH</option>'
    +'</select>'
    +'<input class="form-control form-control-sm port-host" value="'+_esc(defaultHost)+'" placeholder="192.168.1.10" style="width:130px">'
    +'<input class="form-control form-control-sm port-port" value="'+(pcfg.port||'')+'" placeholder="3333" type="number" style="width:80px">'
    +'<button class="btn btn-sm btn-outline-danger py-0 ms-auto" onclick="envRemovePort(\''+id+'\')">×</button>'
    +'</div></div>';
}

window.envAddPort=function(pname,pcfg){
  document.getElementById('envPortList').insertAdjacentHTML('beforeend',_renderPortRow(pname||'',pcfg||{}));
};

window.envRemovePort=function(id){
  var el=document.getElementById(id);
  if(el) el.remove();
};

function _collectExtraPorts(){
  var ports={};
  document.querySelectorAll('#envPortList .port-row').forEach(function(row){
    var name=row.querySelector('.port-name').value.trim();
    if(!name) return;
    ports[name]={
      type:row.querySelector('.port-type').value,
      host:row.querySelector('.port-host').value.trim(),
      port:parseInt(row.querySelector('.port-port').value)||0,
    };
  });
  return ports;
}

/* ----- 表单操作 ----- */
window.envShowAdd=function(){
  document.getElementById('envFormTitle').textContent='添加执行环境';
  document.getElementById('envEditName').value='';
  document.getElementById('envName').value='';document.getElementById('envName').disabled=false;
  document.getElementById('envPlatform').value=(_platforms[0]||{}).name||'pc_func';
  document.getElementById('envPool').value='';
  document.getElementById('envHost').value='';
  document.getElementById('envPort').value='';
  document.getElementById('envUser').value='';
  document.getElementById('envPassword').value='';
  document.getElementById('envFormMsg').textContent='';
  document.getElementById('envPortList').innerHTML='';
  var adv=document.getElementById('envAdvanced');
  if(adv.classList.contains('show')) adv.classList.remove('show');
  document.getElementById('envForm').style.display='';
};

window.envEdit=function(name){
  var t=_targets.find(function(x){return x.name===name;});
  if(!t) return;
  document.getElementById('envFormTitle').textContent='编辑: '+name;
  document.getElementById('envEditName').value=name;
  document.getElementById('envName').value=name;document.getElementById('envName').disabled=true;
  document.getElementById('envPlatform').value=t.platform||'pc_func';
  document.getElementById('envPool').value=t.pool||'';

  // 从 ports 中提取主 SSH 连接
  var ports=t.ports||{};
  var mainHost='',mainPort='',mainUser='',mainPass='';
  var extraPorts={};
  var foundMain=false;
  Object.keys(ports).forEach(function(pk){
    var pc=ports[pk];
    if(!foundMain && pc.type!=='tcp'){
      // 第一个 SSH 端口作为主连接
      mainHost=pc.host||'';
      mainPort=pc.port||'';
      mainUser=pc.user||'';
      if(pc.auth && pc.auth.method==='password') mainPass=pc.auth.password||'';
      foundMain=true;
    }else{
      extraPorts[pk]=pc;
    }
  });

  document.getElementById('envHost').value=mainHost;
  document.getElementById('envPort').value=mainPort;
  document.getElementById('envUser').value=mainUser;
  document.getElementById('envPassword').value=mainPass;

  document.getElementById('envFormMsg').textContent='';

  // 额外端口
  var portList=document.getElementById('envPortList');
  portList.innerHTML='';
  Object.keys(extraPorts).forEach(function(pk){
    envAddPort(pk,extraPorts[pk]);
  });

  // 如果有高级字段内容，自动展开
  var adv=document.getElementById('envAdvanced');
  var hasAdv=Object.keys(extraPorts).length;
  if(hasAdv && !adv.classList.contains('show')) adv.classList.add('show');
  if(!hasAdv && adv.classList.contains('show')) adv.classList.remove('show');

  document.getElementById('envForm').style.display='';
};

window.envCancelForm=function(){
  document.getElementById('envForm').style.display='none';
};

window.envSave=function(){
  var editName=document.getElementById('envEditName').value;
  var name=document.getElementById('envName').value.trim();
  var msg=document.getElementById('envFormMsg');
  if(!name){msg.textContent='名称不能为空';return;}

  // 构建 ports：主 SSH + 额外端口
  var ports={};
  var host=document.getElementById('envHost').value.trim();
  var port=parseInt(document.getElementById('envPort').value)||0;
  var user=document.getElementById('envUser').value.trim();
  var password=document.getElementById('envPassword').value;

  if(host){
    var ctrl={type:'ssh',host:host,port:port||22,user:user};
    if(password) ctrl.auth={method:'password',password:password};
    ports['ctrl']=ctrl;
  }

  // 合并额外端口
  var extra=_collectExtraPorts();
  Object.keys(extra).forEach(function(k){
    // 额外端口如果没填 host，继承主连接的 host
    if(!extra[k].host && host) extra[k].host=host;
    ports[k]=extra[k];
  });

  var body={
    name:name,
    platform:document.getElementById('envPlatform').value,
    pool:document.getElementById('envPool').value.trim(),
    ports:ports,
  };

  var url,method;
  if(editName){
    url='/api/targets/'+encodeURIComponent(editName);method='PUT';
  }else{
    url='/api/targets';method='POST';
  }

  msg.textContent='保存中...';
  fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){msg.textContent=d.error;return;}
      document.getElementById('envForm').style.display='none';
      _loadPools();
      envRefresh();
    })
    .catch(function(e){msg.textContent=''+e;});
};

window.envDel=function(name){
  if(!confirm('确认删除执行环境「'+name+'」？')) return;
  fetch('/api/targets/'+encodeURIComponent(name),{method:'DELETE'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error) alert(d.error);
      else envRefresh();
    });
};

window.envSyncFromServer=function(){
  _syncAction('/api/targets/sync','envSyncMsg',null,function(d){
    _loadPools();
    envRefresh();
    return '已同步 '+d.total+' 个执行环境';
  });
};

/* ----- 一键重启 ----- */
window.envRestart=function(name){
  if(!confirm('确认重启环境「'+name+'」？')) return;
  var el=document.getElementById('env-st-'+name);
  if(el) el.innerHTML='<span class="spinner-border spinner-border-sm"></span> 重启中...';

  /* Remove old result panel */
  var oldPanel=document.getElementById('envRestartResult');
  if(oldPanel) oldPanel.remove();

  fetch('/api/targets/'+encodeURIComponent(name)+'/restart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){alert(d.error);if(el)el.textContent='—';return;}
      var ok=d.ok;
      if(el) el.innerHTML=ok?'<span class="text-success">已重启</span>':'<span class="text-danger">重启失败</span>';

      /* Show step-by-step results */
      var html='<div id="envRestartResult" class="card mt-2 mb-2"><div class="card-body py-2">'
        +'<div class="d-flex align-items-center mb-2">'
        +'<span class="fw-bold me-2">重启结果 — '+_esc(name)+'</span>'
        +'<span class="badge '+(ok?'bg-success':'bg-danger')+'">'+(ok?'成功':'失败')+'</span>'
        +'<button class="btn btn-sm btn-outline-secondary py-0 ms-auto" onclick="this.closest(\'#envRestartResult\').remove()">关闭</button>'
        +'</div>';

      (d.results||[]).forEach(function(r){
        var icon=r.success?'<span class="text-success">✓</span>':'<span class="text-danger">✗</span>';
        html+='<div class="d-flex align-items-start small mb-1">'
          +'<span class="me-2">'+icon+'</span>'
          +'<div>'
          +'<span class="fw-bold">'+_esc(r.name||r.port||'step')+'</span>'
          +(r.duration_s!=null?' <span class="text-muted">('+r.duration_s+'s)</span>':'')
          +(r.attempts>1?' <span class="text-muted">'+r.attempts+' attempts</span>':'');
        if(r.output) html+='<pre class="bg-light border p-1 mt-1 mb-0" style="font-size:.75rem;max-height:100px;overflow:auto;white-space:pre-wrap">'+_esc(r.output)+'</pre>';
        if(r.error) html+='<pre class="bg-dark text-danger p-1 mt-1 mb-0" style="font-size:.75rem;max-height:100px;overflow:auto;white-space:pre-wrap">'+_esc(r.error)+'</pre>';
        html+='</div></div>';
      });
      html+='</div></div>';

      var table=document.getElementById('envTbody').closest('table');
      table.insertAdjacentHTML('afterend',html);
    })
    .catch(function(){if(el)el.textContent='错误';});
};

/* ----- 文件管理（重启脚本 + 烧录文件） ----- */
var _envFileTarget='';
window.envScripts=function(name){
  _envFileTarget=name;
  var existing=document.getElementById('envFilePanel');
  if(existing) existing.remove();

  Promise.all([
    fetch('/api/targets/'+encodeURIComponent(name)+'/scripts').then(function(r){return r.json();}),
    fetch('/api/targets/'+encodeURIComponent(name)+'/files').then(function(r){return r.json();}),
    fetch('/api/targets').then(function(r){return r.json();})
  ]).then(function(all){
    var scripts=all[0], files=all[1], targets=all[2];
    var t=targets.find(function(x){return x.name===name;});
    var ports=t&&t.ports?Object.keys(t.ports):['default'];
    if(!ports.length) ports=['default'];

    var html='<div id="envFilePanel" class="card mt-2 mb-2"><div class="card-body py-2">'
      +'<div class="d-flex align-items-center mb-2">'
      +'<span class="fw-bold me-2">文件管理 — '+_esc(name)+'</span>'
      +'<button class="btn btn-sm btn-outline-secondary py-0 ms-auto" onclick="this.closest(\'#envFilePanel\').remove()">关闭</button>'
      +'</div>';

    /* Restart scripts per port */
    html+='<div class="small fw-bold mb-1">重启脚本（按端口）</div>'
      +'<table class="table table-sm mb-2" style="font-size:.83rem"><thead><tr><th>端口</th><th>脚本</th><th></th></tr></thead><tbody>';
    ports.forEach(function(p){
      var s=scripts[p];
      html+='<tr><td>'+_esc(p)+'</td>'
        +'<td>'+(s?_esc(s.filename):'<span class="text-muted">未上传</span>')+'</td>'
        +'<td>'
        +'<input type="file" id="script-file-'+_esc(p)+'" accept=".sh,.bash,.py" style="display:none" '
        +'onchange="envUploadScript(\''+_esc(name)+'\',\''+_esc(p)+'\',this)">'
        +'<button class="btn btn-sm btn-outline-primary py-0" onclick="document.getElementById(\'script-file-'+_esc(p)+'\').click()">上传</button>'
        +'</td></tr>';
    });
    html+='</tbody></table>';

    /* General files (firmware, configs, etc.) */
    html+='<div class="small fw-bold mb-1">环境文件（烧录文件、配置等）</div>';
    if(files.length){
      html+='<table class="table table-sm mb-1" style="font-size:.83rem"><tbody>';
      files.forEach(function(f){
        html+='<tr><td>'+_esc(f.name)
          +(f.is_script?' <span class="badge bg-secondary" style="font-size:.6rem">脚本</span>':'')
          +'</td><td class="text-muted">'+(f.size<1024?f.size+'B':(f.size/1024).toFixed(1)+'KB')+'</td>'
          +'<td><button class="btn btn-sm btn-outline-danger py-0" style="font-size:.7rem" '
          +'onclick="envDeleteFile(\''+_esc(name)+'\',\''+_esc(f.name)+'\')">删除</button></td></tr>';
      });
      html+='</tbody></table>';
    }else{
      html+='<p class="text-muted small mb-1">暂无文件</p>';
    }
    html+='<div class="d-flex align-items-center gap-1">'
      +'<input type="file" id="envFileUpload" multiple style="display:none" onchange="envUploadFiles(\''+_esc(name)+'\',this)">'
      +'<button class="btn btn-sm btn-outline-primary py-0" onclick="document.getElementById(\'envFileUpload\').click()">上传文件</button>'
      +'<small class="text-muted">支持烧录文件(.bin/.bit/.hex)、脚本(.sh/.py)、配置等</small>'
      +'</div>';

    html+='</div></div>';
    var table=document.getElementById('envTbody').closest('table');
    table.insertAdjacentHTML('afterend',html);
  });
};

window.envUploadScript=function(name,port,input){
  var f=input.files[0];if(!f)return;
  var fd=new FormData();fd.append('file',f);
  fetch('/api/targets/'+encodeURIComponent(name)+'/scripts/'+encodeURIComponent(port),{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){alert(d.error);return;}
      envScripts(name);
    });
};

window.envUploadFiles=function(name,input){
  var files=input.files;if(!files.length)return;
  var promises=[];
  for(var i=0;i<files.length;i++){
    var fd=new FormData();fd.append('file',files[i]);
    promises.push(fetch('/api/targets/'+encodeURIComponent(name)+'/files',{method:'POST',body:fd}).then(function(r){return r.json();}));
  }
  Promise.all(promises).then(function(){envScripts(name);});
};

window.envDeleteFile=function(name,filename){
  if(!confirm('删除 '+filename+'？')) return;
  fetch('/api/targets/'+encodeURIComponent(name)+'/files/'+encodeURIComponent(filename),{method:'DELETE'})
    .then(function(r){return r.json();})
    .then(function(d){if(d.error)alert(d.error);else envScripts(name);});
};

/* ----- 环境健康自动刷新 ----- */
function envHealthRefresh(){
  fetch('/api/targets/health').then(function(r){return r.json();}).then(function(data){
    Object.keys(data).forEach(function(name){
      var el=document.getElementById('env-st-'+name);
      if(!el) return;
      var st=data[name];
      if(st==='local') el.innerHTML='<span class="text-muted">本地</span>';
      else if(st==='ok') el.innerHTML='<span class="text-success">在线</span>';
      else el.innerHTML='<span class="text-danger">离线</span>';
    });
  }).catch(function(){});
}

/* init */
_loadPlatforms();
_loadPools();
envRefresh();
setTimeout(envHealthRefresh,1000);
})();
</script>
